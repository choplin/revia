[package]
name = "revia"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "An interactive terminal UI for reviewing Git diffs"
license = "MIT"
repository = "https://github.com/choplin/revia"
homepage = "https://github.com/choplin/revia"
readme = "README.md"
keywords = ["git", "diff", "review", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src",
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }"
pkg-fmt = "txz"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
urushi = "0.1.0"
urushi-tui-app = { version = "0.1.0", default-features = false }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
unicode-width = "0.2"
unicode-segmentation = "1.13"

[target.'cfg(unix)'.dependencies]
urushi-terminal = { version = "0.1.0", default-features = false }

[dev-dependencies]
tempfile = "3.23"

[profile.dist]
inherits = "release"
lto = "thin"
