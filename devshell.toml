[devshell]
name = "revia"

[[env]]
name = "CARGO_HOME"
eval = "${CARGO_HOME:-$HOME/.cargo}"

[[env]]
name = "PATH"
prefix = "${CARGO_HOME}/bin"

[[commands]]
name = "install-local"
help = "Install the local revia release binary into Cargo's bin directory"
command = '''
cargo install --path "$PRJ_ROOT" --locked --force
'''
